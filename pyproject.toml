[tool.poetry]
name = "custom-auth-system"
version = "0.1.0"
description = ""
authors = ["Olga Kazorina <nefertituolga@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^6.0.1"
djangorestframework = "^3.16.1"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.2.1"
django-stubs = "^5.2.9"
djangorestframework-stubs = "^3.16.7"
ipython = "^9.9.0"
jwt = "^1.4.0"
pyjwt = "^2.10.1"
packaging = "26.0"
django-filter = "^25.2"


[tool.poetry.group.lint.dependencies]
black = "^26.1.0"
flake8 = "^7.3.0"
isort = "^7.0.0"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
strict_optional = true
exclude = ["venv", "tests", ".*migrations/.*", ]
plugins = [
    "mypy_django_plugin.main",
]

[tool.black]
line-length = 119
exclude = '''
(
  /(
    | \.git
    | \.mypy_cache
    | \.venv
    )/
)
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
skip_gitignore = true

[tool.flake8]
max-line-length = 119
ignore = "E503, E121, E122, E501"
exclude =  [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "*.min.js",
    "*.min.css",
    "build",
    "dist",
    "migrations"
]
[tool.django-stubs]
django_settings_module = "config.settings"
strict_settings = true
